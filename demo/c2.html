  <div id="content">
    <p>雨停的时候天已经黑透了。</p>
    <p>沈砚在镇上找了间客栈住下，掌柜的给他点了一盏油灯。灯芯烧得不好，一跳一跳的，影子在墙上跟着晃。</p>
    <p>他从包袱里摸出一封信，信封上什么也没写。这封信他带了十年，一直没拆。</p>
    <p>窗外的巷子里有人在唱一支很旧的曲子，唱到一半就停了。</p>
