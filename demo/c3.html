  <div id="content">
    <p>第二天早上他又去了渡口。</p>
    <p>船家换了个人，年轻些，问他去哪儿。他说不上来，就报了一个地名。年轻人点点头，说顺路。</p>
    <p>船离岸的时候，他回头看了一眼那间客栈。灯还亮着，虽然天已经大亮了。</p>
    <p>他把那封信留在了桌上，压在灯台底下。</p>
