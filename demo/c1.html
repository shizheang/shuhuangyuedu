  <h2 class="chapter-title">第一章 雨夜</h2>

  <div id="content">
    <p>雨是从傍晚开始下的。</p>
    <p>沈砚站在渡口的棚子底下，看着对岸的灯一盏一盏亮起来。船家说今晚不摆渡了，水太大。他也没争，只是把包袱往怀里拢了拢，靠着柱子坐下来。</p>
    <p>十年前他也在这里等过船。那天下的是雪，同行的人叫江迟，两个人挤在一件旧棉袄里，谁也没说话。</p>
    <p>后来江迟上了船，他没有。船开出去很远的时候，江迟回头看了一眼，他假装在系鞋带。</p>
